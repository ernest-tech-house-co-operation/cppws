name: Beta / Prerelease (beta)

# Every push to `beta` produces a prerelease build tagged
# v<version>-beta.<short-sha>.<run-number>, published to npm under the
# `beta` dist-tag. Binaries go to a matching GitHub prerelease. Does not
# touch the `latest` dist-tag used by master releases.

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]
    types: [closed]

concurrency:
  group: beta-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-test:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64-gnu
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64-msvc
    runs-on: ${{ matrix.os }}
    outputs:
      beta_version: ${{ steps.version.outputs.beta_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute beta version
        id: version
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BASE_VERSION=$(node -p "require('./package.json').version")
          BETA_VERSION="${BASE_VERSION}-beta.${SHORT_SHA}.${{ github.run_number }}"
          echo "beta_version=${BETA_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install cmake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libuv1-dev

      - name: Install cmake + libuv (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake libuv

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/build-${{ runner.os == 'macOS' && 'macos' || 'linux' }}.sh
          ./scripts/build-${{ runner.os == 'macOS' && 'macos' || 'linux' }}.sh --release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Release

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        if: runner.os != 'Windows'
        run: npx tsx tests/integration/testmain.ts

      - name: Integration tests skipped (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Write-Host "Skipping integration tests on Windows -- known intermittent native-thread timing issue, see README > Known Issues."

      - name: Stage + pack prebuilt binary
        env:
          CPPWS_SKIP_DOWNLOAD: "1"
        run: node scripts/prebuild.js --pack

      # NOTE: the tarball keeps its plain name (cppws-native-<target>.tar.gz).
      # postinstall.js always requests that exact filename — versioning
      # comes from which release tag it's attached to (v<beta_version>),
      # not from the filename itself.
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.target }}
          path: prebuilds/*/cppws-native-*.tar.gz

  publish-beta:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for action-gh-release to create/update releases
    env:
      BETA_VERSION: ${{ needs.build-and-test.outputs.beta_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Set prerelease version in package.json
        run: npm version "$BETA_VERSION" --no-git-tag-version --allow-same-version

      - name: Create GitHub prerelease with binary tarballs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BETA_VERSION }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/**/*.tar.gz

      - name: Publish JS package to npm under beta tag
        run: npm publish --tag beta --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}