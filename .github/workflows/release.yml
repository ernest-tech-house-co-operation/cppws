name: Release (master)

# Triggered by a push or merged PR into master.
# Builds native binaries for every supported target, runs the full test
# suite, then publishes an official release to npm + GitHub Releases.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [closed]

jobs:
  build-and-test:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64-gnu
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install cmake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libuv1-dev

      - name: Install cmake + libuv (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake libuv

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/build-${{ runner.os == 'macOS' && 'macos' || 'linux' }}.sh
          ./scripts/build-${{ runner.os == 'macOS' && 'macos' || 'linux' }}.sh --release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Release

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        if: runner.os != 'Windows'
        run: npx tsx tests/integration/testmain.ts

      - name: Integration tests skipped (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Write-Host "Skipping integration tests on Windows -- known intermittent native-thread timing issue, see README > Known Issues."

      - name: Stage prebuilt binary
        run: node scripts/prebuild.js --pack

      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.target }}
          path: prebuilds/

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          path: prebuilds/
          merge-multiple: true

      - name: Publish platform binary packages (@cppws/*)
        run: |
          for dir in prebuilds/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            echo "Publishing $name..."
            (cd "$dir" && npm publish --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: prebuilds/**/*