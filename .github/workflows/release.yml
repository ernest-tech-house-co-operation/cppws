name: Release (master)

# Triggered by a push or merged PR into master.
#
# There is exactly ONE version number in this project: package.json's
# "version". Everything else derives from it:
#   - the GitHub Release is tagged v<version>
#   - the binary tarballs uploaded to that release are named
#     cppws-native-<target>.tar.gz (see scripts/prebuild.js)
#   - npm publishes the JS package under that same version
#   - postinstall.js downloads from the release tagged v<version>
#
# npm never sees a compiled binary and never publishes a platform
# package — only the JS side goes to npm. Binaries live on GitHub
# Releases and are fetched by postinstall.js at install time.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [closed]

jobs:
  build-and-test:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64-gnu
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install cmake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libuv1-dev

      - name: Install cmake + libuv (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake libuv

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/build-${{ runner.os == 'macOS' && 'macos' || 'linux' }}.sh
          ./scripts/build-${{ runner.os == 'macOS' && 'macos' || 'linux' }}.sh --release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Release

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        if: runner.os != 'Windows'
        run: npx tsx tests/integration/testmain.ts

      - name: Integration tests skipped (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Write-Host "Skipping integration tests on Windows -- known intermittent native-thread timing issue, see README > Known Issues."

      - name: Stage + pack prebuilt binary
        env:
          CPPWS_SKIP_DOWNLOAD: "1" # this is the build job, not an npm install
        run: node scripts/prebuild.js --pack

      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.target }}
          # Only the tarball is needed downstream — the raw .node file
          # doesn't need to travel between jobs.
          path: prebuilds/*/cppws-native-*.tar.gz

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for action-gh-release to create/update releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Read version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with binary tarballs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: release-assets/**/*.tar.gz

      - name: Install JS toolchain (skip native download/build entirely)
        run: CPPWS_SKIP_DOWNLOAD=1 npm install --ignore-scripts

      - name: Build JS output only (dist/) — no native compile here
        run: npm run build:ts

      - name: Publish JS package to npm (no binaries)
        run: npm publish --ignore-scripts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
